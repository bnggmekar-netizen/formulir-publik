<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulir Percobaan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 450px;
      margin: 40px auto;
      padding: 20px;
      background: #f1f5f9;
    }
    .kotak {
      background: white;
      padding: 24px;
      border-radius: 12px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 16px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="kotak">
    <h2>Formulir Percobaan</h2>
    <form id="formulir">
      <label>Nama</label>
      <input type="text" name="nama" required maxlength="100">  <label>Tanggal lahir</label>
  <input type="date" name="tanggal_lahir" required>

  <button type="submit">Kirim</button>
</form>
<p id="status"></p>

  </div>  <script>
    document.getElementById("formulir").addEventListener("submit", function(event) {
      event.preventDefault();
      document.getElementById("status").textContent =
        "Formulir berhasil diuji di browser. Belum ada data yang disimpan ke server.";
    });
  </script></body>
</html>
